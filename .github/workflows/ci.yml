name: Product V2 CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python scripts/check_release_context.py
      - run: pip-audit --requirement requirements.txt --progress-spinner off
      - run: pytest -m "not mysql" -q

  mysql:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4.10@sha256:c592c15aaf4a1961e15d82eb31ea5987dda862d1c4b1e93424438c0e91dc1f8d
        env:
          MYSQL_DATABASE: autoleadgen_test
          MYSQL_USER: autoleadgen_test
          MYSQL_PASSWORD: mysql-test-password
          MYSQL_ROOT_PASSWORD: mysql-root-test-password
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uautoleadgen_test -pmysql-test-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      # The migration-history test creates and drops a uniquely named *_test
      # database. Root is confined to this disposable CI service; production
      # runtime credentials remain least-privilege mounted secrets.
      PRODUCT_V2_MYSQL_TEST_URL: mysql+pymysql://root:mysql-root-test-password@127.0.0.1:3306/autoleadgen_test?charset=utf8mb4
      DATABASE_URL: mysql+pymysql://root:mysql-root-test-password@127.0.0.1:3306/autoleadgen_test?charset=utf8mb4
      JWT_SECRET_KEY: ci-only-jwt-secret
      AUTOLEADGEN_ENV: test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -m mysql -q

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check:api-types
      - run: npm test
      - run: npm run lint
      - run: npm run build
        env:
          BACKEND_URL: http://api:8001
          DEPLOYMENT_VERSION: ${{ github.sha }}

  deployment-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AUTOLEADGEN_ENV: production
      APP_DOMAIN: app.example.com
      CORS_ORIGINS: https://app.example.com
      ALLOWED_HOSTS: app.example.com
      RELEASE_SHA: 0123456789abcdef0123456789abcdef01234567
      PRODUCTION_CHANGE_ID: CI-DEPLOYMENT-ASSET-CHECK
      BACKEND_IMAGE: ghcr.io/example/autoleadgen-api
      BACKEND_IMAGE_DIGEST: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      FRONTEND_IMAGE: ghcr.io/example/autoleadgen-frontend
      FRONTEND_IMAGE_DIGEST: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
      DATABASE_URL_SECRET_PATH: /tmp/autoleadgen-secrets/database_url
      JWT_SECRET_PATH: /tmp/autoleadgen-secrets/jwt_secret
      SMTP_ENCRYPTION_KEY_SECRET_PATH: /tmp/autoleadgen-secrets/smtp_encryption_key
      UNSUBSCRIBE_TOKEN_SECRET_PATH: /tmp/autoleadgen-secrets/unsubscribe_token_secret
      WEBHOOK_SECRET_PATH: /tmp/autoleadgen-secrets/product_v2_webhook_secret
      RUNTIME_CONTROL_DIR: /tmp/autoleadgen-runtime-control
      BACKFILL_EVIDENCE_DIR: /tmp/autoleadgen-backfill-evidence
      PRODUCT_V2_BACKUP_RESTORE_EVIDENCE_ID: ci-restore-evidence
      PRODUCT_V2_MONITORING_EVIDENCE_ID: ci-monitoring-evidence
      PRODUCT_V2_STAGING_ACCEPTANCE_EVIDENCE_ID: ci-staging-evidence
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Validate production Compose interpolation and schema
        run: docker compose -f compose.production.yml config --quiet
      - name: Validate Caddy production gateway configuration
        run: >-
          docker run --rm
          --entrypoint caddy
          --env APP_DOMAIN=app.example.com
          --volume "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
          validate --config /etc/caddy/Caddyfile
      - name: Validate Prometheus alert rules
        run: >-
          docker run --rm
          --entrypoint /bin/promtool
          --volume "$PWD/deploy/monitoring/prometheus-rules.yml:/etc/prometheus/prometheus-rules.yml:ro"
          prom/prometheus:v3.5.0
          check rules /etc/prometheus/prometheus-rules.yml

  browser-acceptance:
    needs: [backend, mysql, frontend, deployment-assets]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      AUTOLEADGEN_ENV: local
      AUTOLEADGEN_CONNECTOR_MODE: fake
      ALLOW_REAL_EXTERNAL_CALLS: "false"
      OUTBOUND_HARD_PAUSE: "true"
      PRODUCT_V2_ISOLATED_DATABASE: "true"
      PRODUCT_V2_LEGACY_READ_ONLY: "true"
      PRODUCT_V2_OWNER_PATH_ENFORCEMENT: "false"
      DATABASE_URL: sqlite+pysqlite:////tmp/autoleadgen-live-e2e.db
      JWT_SECRET_KEY: ci-isolated-live-acceptance-jwt-key
      LOCAL_ACCEPTANCE_USERNAME: acceptance-admin
      LOCAL_ACCEPTANCE_PASSWORD_FILE: /tmp/autoleadgen-live-e2e-password
      LIVE_V2_ACCEPTANCE: "1"
      LIVE_V2_BASE_URL: http://127.0.0.1:3101
      LIVE_V2_USERNAME: acceptance-admin
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements-dev.txt
      - run: npm --prefix frontend ci
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm --prefix frontend run test:e2e
      - name: Prepare isolated live acceptance database
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          openssl rand -out "$LOCAL_ACCEPTANCE_PASSWORD_FILE" -base64 24
          python -m alembic upgrade head
          python scripts/bootstrap_local_acceptance.py
      - name: Start isolated API and frontend
        shell: bash
        run: |
          set -euo pipefail
          python -m uvicorn main:app --host 127.0.0.1 --port 8001 > /tmp/autoleadgen-api.log 2>&1 &
          echo "$!" > /tmp/autoleadgen-api.pid
          BACKEND_URL=http://127.0.0.1:8001 npm --prefix frontend run dev -- --hostname 127.0.0.1 --port 3101 > /tmp/autoleadgen-frontend.log 2>&1 &
          echo "$!" > /tmp/autoleadgen-frontend.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8001/health/ready >/dev/null \
              && curl --fail --silent http://127.0.0.1:3101/login >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Run real local API browser acceptance
        shell: bash
        working-directory: frontend
        run: |
          set -euo pipefail
          LIVE_V2_PASSWORD="$(tr -d '\r\n' < "$LOCAL_ACCEPTANCE_PASSWORD_FILE")" \
            npx playwright test --config=playwright.live.config.ts
      - name: Print service logs on failure
        if: failure()
        run: |
          tail -200 /tmp/autoleadgen-api.log 2>/dev/null || true
          tail -200 /tmp/autoleadgen-frontend.log 2>/dev/null || true
      - name: Stop isolated services
        if: always()
        run: |
          test ! -f /tmp/autoleadgen-api.pid || kill "$(cat /tmp/autoleadgen-api.pid)" 2>/dev/null || true
          test ! -f /tmp/autoleadgen-frontend.pid || kill "$(cat /tmp/autoleadgen-frontend.pid)" 2>/dev/null || true

  container-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - name: api
            context: .
            dockerfile: Dockerfile
          - name: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          load: true
          tags: autoleadgen-${{ matrix.name }}:ci
          build-args: |
            DEPLOYMENT_VERSION=${{ github.sha }}
      - uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          image-ref: autoleadgen-${{ matrix.name }}:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
