version: '3.8'

services:
  autoleadgen:
    build: .
    container_name: autoleadgen
    restart: always
    command: ["gunicorn", "main:app", "--worker-class", "uvicorn.workers.UvicornWorker", "--workers", "1", "--bind", "0.0.0.0:8001", "--timeout", "120", "--graceful-timeout", "30"]
    ports:
      - "8001:8001"
    dns:
      - 223.5.5.5
      - 114.114.114.114
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://127.0.0.1:8001/health', timeout=5).raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build: ./frontend
    container_name: autoleadgen-frontend
    restart: always
    ports:
      - "8888:8888"
    environment:
      - BACKEND_URL=http://autoleadgen:8001
    depends_on:
      autoleadgen:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
